name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + test + bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib
          if-no-files-found: error

  publish:
    name: Publish to npm (trusted publishing / OIDC)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # Do NOT set registry-url here: setup-node would write an .npmrc with a
      # _authToken=${NODE_AUTH_TOKEN} placeholder and export a bogus NODE_AUTH_TOKEN,
      # which makes npm prefer that token over the OIDC exchange and fail with
      # 404 on PUT (npm/cli#8730, npm/cli#8976). Default registry is npmjs.org.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs Node >= 22.14 / npm >= 11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upgrade npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Clear npm auth leftovers so OIDC wins
        run: |
          rm -f "$HOME/.npmrc"
          unset NODE_AUTH_TOKEN

      # npm publish runs prepublishOnly (typecheck + test + build) first.
      # No NPM_TOKEN needed: npm exchanges the OIDC token with the registry.
      - name: Publish to npm
        run: npm publish --provenance --access public
